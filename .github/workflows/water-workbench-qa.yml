name: BRKAR water workbench browser acceptance

on:
  pull_request:
    paths:
      - "src/mission-lab.tsx"
      - "src/water-workbench.tsx"
      - "src/water-workbench.css"
      - "tests/water-browser.mjs"
      - ".github/workflows/water-workbench-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Run isolated local preview
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/brkar-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/mission/water >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/brkar-vite.log
          exit 1
      - name: Exercise water workbench in four viewports
        run: node tests/water-browser.mjs
      - name: Upload acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-workbench-browser-acceptance
          path: artifacts/water-workbench/
          if-no-files-found: ignore
